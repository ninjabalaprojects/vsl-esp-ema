<script>
(function () {
  'use strict';

  /* ── 1. DATA DINÂMICA na barra de urgência ── */
  (function setDeadline() {
    var el = document.getElementById('deadline-date');
    if (!el) return;
    var d = new Date();
    var day   = String(d.getDate()).padStart(2, '0');
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var year  = d.getFullYear();
    el.textContent = day + '/' + month + '/' + year;
  })();

  /* ── 2. BLOQUEAR CLIQUE DIREITO ── */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ── 4. BLOQUEAR ATALHOS DE TECLADO ── */
  document.addEventListener('keydown', function (e) {
    var key = e.key || '';
    var ctrl = e.ctrlKey || e.metaKey;

    // F12, Ctrl+U, Ctrl+S, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
    if (
      e.keyCode === 123 ||                          // F12
      (ctrl && key.toLowerCase() === 'u') ||        // Ctrl+U
      (ctrl && key.toLowerCase() === 's') ||        // Ctrl+S
      (ctrl && e.shiftKey && key.toLowerCase() === 'i') ||
      (ctrl && e.shiftKey && key.toLowerCase() === 'j') ||
      (ctrl && e.shiftKey && key.toLowerCase() === 'c') ||
      (ctrl && key.toLowerCase() === 'p')           // Ctrl+P (print)
    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });

  /* ── 5. DETECTAR DEVTOOLS — apenas oculta conteúdo sensível, não quebra a página ── */
  var devtoolsOpen = false;
  function checkDevTools() {
    var threshold = 200;
    var widthDiff  = window.outerWidth  - window.innerWidth  > threshold;
    var heightDiff = window.outerHeight - window.innerHeight > threshold;
    // Só age se ambas as dimensões indicarem DevTools (reduz falso positivo)
    if (widthDiff && heightDiff) {
      if (!devtoolsOpen) {
        devtoolsOpen = true;
        var pb = document.getElementById('player-box');
        if (pb) pb.style.visibility = 'hidden';
      }
    } else {
      if (devtoolsOpen) {
        devtoolsOpen = false;
        var pb = document.getElementById('player-box');
        if (pb) pb.style.visibility = 'visible';
      }
    }
  }
  setInterval(checkDevTools, 1500);

  /* ── 6. BLOQUEAR ARRASTAR IMAGENS / ELEMENTOS ── */
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });

  /* ── 7. BLOQUEAR COPIAR / CORTAR ── */
  document.addEventListener('copy',  function (e) { e.preventDefault(); });
  document.addEventListener('cut',   function (e) { e.preventDefault(); });

  /* ── 8. DESABILITAR SELEÇÃO DE TEXTO via JS (redundante ao CSS) ── */
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });

})();
